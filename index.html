<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>واما | WAMA</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --secondary: #10b981;
      --dark: #0f172a;
      --light: #f8fafc;
      --text: #1e293b;
      --muted: #475569;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #f0f9ff 0%, #f8fafc 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(92vw, 760px);
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(2,132,199,0.12);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(2,132,199,0.12);
      padding: 48px 32px;
      text-align: center;
    }

    .logo {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: var(--white);
      font-size: 2.2rem;
      box-shadow: 0 12px 30px rgba(2,132,199,0.25);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--dark);
    }

    p {
      margin: 0 auto 28px;
      max-width: 560px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 1.08rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-decoration: none;
      background: #0f172a;
      color: var(--white);
      padding: 16px 28px;
      border-radius: 16px;
      font-weight: 700;
      box-shadow: 0 12px 26px rgba(15,23,42,0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(15,23,42,0.22);
    }

    .play-icon {
      width: 24px;
      height: 24px;
      display: inline-block;
      background: linear-gradient(135deg, #34a853, #4285f4);
      border-radius: 6px;
      position: relative;
    }

    .play-icon::before {
      content: "▶";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 12px;
      color: white;
      transform: translateX(1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">💧</div>
    <h1>واما | WAMA</h1>
    <p>تحميل التطبيق الرسمي من متجر Google Play لتجربة إدارة عدادات المياه والفواتير بسهولة وأمان.</p>
    <a
      class="cta"
      href="https://play.google.com/store/apps/details?id=com.wama.water_meter_manager"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="تحميل التطبيق من متجر Google Play"
    >
      <span class="play-icon" aria-hidden="true"></span>
      <span>تحميل التطبيق</span>
    </a>
  </main>
</body>
</html>
